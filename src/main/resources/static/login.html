<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>登录页面</title>
    </head>

    <body>
        <form>
            <table>
                <tr>
                    <td>用户名</td>
                    <td><input type="text" id="username" /></td>
                </tr>

                <tr>
                    <td>密码</td>
                    <td><input type="password" id="password" /></td>
                </tr>

                <tr>
                    <td>
                        <button type="button" id="login">登录</button>
                    </td>
                    <td>
                        <button type="reset">重置</button>
                    </td>
                </tr>
            </table>
        </form>

        <script src="/js/login.js"></script>
    </body>
</html>
